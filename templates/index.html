<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASG Control Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-900">Agent Security Gateway (ASG)</h1>
            <p class="text-gray-600 mt-2">Interactive Prototype: Observe enforcement, validation, and audit in real-time.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Control Panel -->
            <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-blue-700">1. Simulate Agent Request</h2>
                <form id="requestForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Test Principal (Demo)</label>
                        <select id="principal" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                            <option value="user_1">user_1 (Admin)</option>
                            <option value="user_2">user_2 (Viewer)</option>
                            <option value="unknown_user">unknown_user (Unauthenticated)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Requested Tool</label>
                        <select id="tool" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                            <option value="read_database">read_database</option>
                            <option value="delete_all_data">delete_all_data (Unknown)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Target Resource</label>
                        <select id="resource" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                            <option value="public_data">public_data</option>
                            <option value="restricted_data">restricted_data</option>
                            <option value="secret_data">secret_data (Invalid)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                        Submit to ASG
                    </button>
                </form>

                <!-- Result Display -->
                <div id="resultBox" class="mt-6 hidden">
                    <h3 class="text-sm font-semibold text-gray-700 mb-2">Gateway Response</h3>
                    <div id="resultContent" class="p-3 rounded-md text-sm font-mono break-all"></div>
                </div>
            </div>

            <!-- Audit Log -->
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-900">2. Correlated Audit Trail</h2>
                    <button onclick="loadAudit()" class="text-sm text-blue-600 hover:underline">Refresh</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-3 py-2 text-left font-medium text-gray-500">Request ID</th>
                                <th class="px-3 py-2 text-left font-medium text-gray-500">Principal</th>
                                <th class="px-3 py-2 text-left font-medium text-gray-500">Action</th>
                                <th class="px-3 py-2 text-left font-medium text-gray-500">Phase</th>
                                <th class="px-3 py-2 text-left font-medium text-gray-500">Outcome</th>
                                <th class="px-3 py-2 text-left font-medium text-gray-500">Reason</th>
                            </tr>
                        </thead>
                        <tbody id="auditTableBody" class="divide-y divide-gray-200">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

        <script>
        let authToken = "";

        // 1. Fetch a demo token on load
                // 1. Fetch a demo token on load
        async function fetchToken(principal = "user_1") {
            try {
                // Explicitly set method to POST
                const response = await fetch(`/api/v1/auth/demo-token?principal_id=${principal}`, {
                    method: 'POST'
                });
                
                if (!response.ok) {
                    console.error("Token fetch failed:", response.status);
                    throw new Error("Failed to fetch token");
                }
                
                const data = await response.json();
                authToken = data.access_token;
                console.log("Demo token acquired for", principal);
            } catch (error) {
                console.error("Token fetch error:", error);
            }
        }

        async function loadAudit() {
            if (!authToken) {
                console.warn("No auth token available for audit load");
                return;
            }
            try {
                const res = await fetch('/api/v1/audit', {
                    headers: { "Authorization": `Bearer ${authToken}` }
                });
                if (!res.ok) throw new Error("Audit fetch failed");
                const logs = await res.json();
                const tbody = document.getElementById('auditTableBody');
                tbody.innerHTML = '';
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-3 py-4 text-center text-gray-500">No audit records yet. Submit a request to see the trail.</td></tr>';
                    return;
                }
                logs.forEach(log => {
                    const outcomeClass = log.outcome === 'ALLOW' || log.outcome === 'SUCCESS' ? 'text-green-700 bg-green-50' : 'text-red-700 bg-red-50';
                    const row = `
                        <tr>
                            <td class="px-3 py-2 font-mono text-xs text-gray-600">${log.request_id.substring(0,8)}...</td>
                            <td class="px-3 py-2">${log.principal_id}</td>
                            <td class="px-3 py-2">${log.tool_name}:${log.resource_id}</td>
                            <td class="px-3 py-2 text-gray-500">${log.phase}</td>
                            <td class="px-3 py-2"><span class="px-2 py-1 rounded-full text-xs font-bold ${outcomeClass}">${log.outcome}</span></td>
                            <td class="px-3 py-2 text-gray-600 truncate max-w-xs" title="${log.reason}">${log.reason}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Audit load error:", error);
            }
        }

        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const principal = document.getElementById('principal').value;
            const tool = document.getElementById('tool').value;
            const resource = document.getElementById('resource').value;

            // If the user selects a different principal in the UI, fetch a new token for them
            if (!authToken || principal !== "user_1") {
                await fetchToken(principal);
            }

            if (!authToken) {
                alert("Authentication failed. Please refresh the page.");
                return;
            }

            const payload = {
                tool_name: tool,
                arguments: { table_name: resource }
            };

            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');
            resultBox.classList.remove('hidden');
            resultContent.innerHTML = "Processing...";
            resultContent.className = 'p-3 rounded-md text-sm font-mono break-all bg-blue-50 text-blue-800 border border-blue-200';

            try {
                const res = await fetch('/api/v1/execute', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();

                if (res.status === 200) {
                    resultContent.className = 'p-3 rounded-md text-sm font-mono break-all bg-green-50 text-green-800 border border-green-200';
                    resultContent.innerHTML = `<strong>ALLOWED</strong><br>Request ID: ${data.request_id}<br>Result: ${JSON.stringify(data.result)}`;
                } else if (res.status === 401) {
                    resultContent.className = 'p-3 rounded-md text-sm font-mono break-all bg-red-50 text-red-800 border border-red-200';
                    resultContent.innerHTML = `<strong>UNAUTHORIZED</strong><br>Error: Valid JWT token required.`;
                } else if (res.status === 403) {
                    resultContent.className = 'p-3 rounded-md text-sm font-mono break-all bg-red-50 text-red-800 border border-red-200';
                    resultContent.innerHTML = `<strong>${data.detail.status}</strong><br>Error: ${data.detail.error}`;
                } else if (res.status === 400) {
                    resultContent.className = 'p-3 rounded-md text-sm font-mono break-all bg-red-50 text-red-800 border border-red-200';
                    resultContent.innerHTML = `<strong>${data.detail.status}</strong><br>Error: ${data.detail.error}`;
                } else {
                    resultContent.className = 'p-3 rounded-md text-sm font-mono break-all bg-red-50 text-red-800 border border-red-200';
                    resultContent.innerHTML = `<strong>ERROR ${res.status}</strong><br>${JSON.stringify(data)}`;
                }

                loadAudit();
            } catch (error) {
                console.error("Request error:", error);
                resultContent.className = 'p-3 rounded-md text-sm font-mono break-all bg-red-50 text-red-800 border border-red-200';
                resultContent.innerHTML = `<strong>NETWORK ERROR</strong><br>${error.message}`;
            }
        });

        // Initial load
        fetchToken().then(() => loadAudit());
    </script>
</body>
</html>
